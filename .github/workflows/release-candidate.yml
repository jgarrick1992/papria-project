name: Release candidate evidence

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed-off source tag in the exact form vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify tag and versions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - id: version
        name: Check release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'release_tag must be vX.Y.Z' >&2; exit 1; }
          git rev-parse --verify "refs/tags/$tag" >/dev/null
          version="$(sed -nE 's/^The current project version is \*\*([0-9]+\.[0-9]+\.[0-9]+)\*\*\.$/\1/p' VERSION.md)"
          test -n "$version"
          test "$tag" = "v$version"
          grep -F "versionName = \"$version\"" android/app/build.gradle.kts
          grep -F "MARKETING_VERSION = $version;" ios/Papria.xcodeproj/project.pbxproj
          grep -F "version = \"$version\"" shared/format-core/Cargo.toml
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  source-gates:
    name: Re-run strict source gates for the release tag
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.release_tag }}
    secrets: inherit

  android-candidate:
    name: Android unsigned candidate, checksums, and reports
    needs: [preflight, source-gates]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install pinned Android native build inputs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-11 action commit
        with:
          toolchain: 1.85.1
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install pinned native build tools
        run: |
          cargo install cargo-ndk --version =3.5.4 --locked
          cargo install --git https://github.com/mozilla/uniffi-rs.git --rev 0d38fc51ec057c271233b70db51b13ef403e360d --locked uniffi-bindgen-cli
      - name: Build, test, lint, and package an unsigned Android candidate
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist reports
          set -o pipefail
          {
            java -version
            sdkmanager --version
            rustc -Vv
            cargo -V
            ./android/gradlew --version
            ./android/gradlew --no-daemon -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:verifyNativeCoreDebugPackage :app:verifyNativeCoreReleasePackage :app:verifyLibVlcReleasePackage
            ./android/gradlew --no-daemon -p android :app:dependencies --configuration releaseRuntimeClasspath
          } 2>&1 | tee reports/android-release-candidate.log
          mapfile -t apks < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "dist/Papria-${{ needs.preflight.outputs.version }}-android-UNSIGNED.apk"
          shasum -a 256 "dist/Papria-${{ needs.preflight.outputs.version }}-android-UNSIGNED.apk" > dist/SHA256SUMS.txt
      - name: Generate Android candidate SBOM
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          path: .
          format: cyclonedx-json
          output-file: reports/papria-release-candidate.cdx.json
          upload-artifact: false
      - name: Attest the actual unsigned Android candidate
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/Papria-${{ needs.preflight.outputs.version }}-android-UNSIGNED.apk
      - name: Upload unsigned candidate, checksum, SBOM, and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-android-${{ needs.preflight.outputs.version }}
          path: |
            dist/
            reports/
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 90

  ios-evidence:
    name: iOS test reports and native-core evidence
    needs: [preflight, source-gates]
    # macos-15 currently supplies Xcode 16 / Swift 6, matching the locked
    # SwiftPM graph. The runner label is intentionally explicit.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 2026-08-11 action commit
        with:
          toolchain: 1.85.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install immutable UniFFI generator source revision
        run: cargo install --git https://github.com/mozilla/uniffi-rs.git --rev 0d38fc51ec057c271233b70db51b13ef403e360d --locked uniffi-bindgen-cli
      - name: Build native core, app, and tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          set -o pipefail
          {
            scripts/build-format-core.sh ios
            bash ios/scripts/native_core_build.sh
            device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
            test -n "$device_id"
            sw_vers
            xcodebuild -version
            swift --version
            rustc -Vv
            cargo -V
            xcodebuild -project ios/Papria.xcodeproj -scheme Papria -destination "id=$device_id" CODE_SIGNING_ALLOWED=NO -resultBundlePath "$RUNNER_TEMP/PapriaReleaseCandidateTests.xcresult" test
          } 2>&1 | tee reports/ios-release-candidate.log
      - name: Upload iOS test and toolchain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-ios-${{ needs.preflight.outputs.version }}
          path: |
            reports/
            ${{ runner.temp }}/PapriaReleaseCandidateTests.xcresult
          if-no-files-found: error
          retention-days: 90
