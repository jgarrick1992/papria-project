name: Supply-chain evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  source-inventory:
    name: Source SBOM and pinned-input inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install pinned Android SDK inputs for dependency resolution
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 2026-08-11 action commit
        with:
          toolchain: 1.85.1
      - name: Write reproducibility evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s\n' "$RUNNER_OS"
            java -version
            rustc -Vv
            cargo -V
            sdkmanager --version
            ./android/gradlew --version
            shasum -a 256 android/gradle/wrapper/gradle-wrapper.jar
            shasum -a 256 android/gradle/wrapper/gradle-wrapper.properties
            shasum -a 256 shared/format-core/Cargo.lock
          } > reports/build-inputs.txt 2>&1
          cargo metadata --locked --manifest-path shared/format-core/Cargo.toml --format-version=1 > reports/cargo-metadata.json
          ./android/gradlew --no-daemon -p android :app:dependencies --configuration releaseRuntimeClasspath > reports/android-release-runtime-dependencies.txt
      - name: Generate a source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: reports/papria-source.cdx.json
          upload-artifact: false
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: reports/
          retention-days: 90
