version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(android)"
      include: scope
    groups:
      android-runtime:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /shared/format-core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(rust)"
      include: scope
    groups:
      rust-runtime:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
